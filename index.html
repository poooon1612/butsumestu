================================================

このテンプレートは
「作品を認識して動画を表示する」

第1章では

<html lang="ja">

<head>

  <!-- ======================================== -->
  <!-- 🌏 日本語対応 -->
  <!-- ======================================== -->

  <!--
  charset="UTF-8"

  日本語が文字化けしないようにします。

  これが無いと

  あいうえお

  ↓

  ???????

  になることがあります。
  -->

  <meta charset="UTF-8">




  <!-- ======================================== -->
  <!-- 📱 スマホ対応 -->
  <!-- ======================================== -->

  <!--
  viewport は

  スマホ画面サイズに合わせる設定です。

  WebARでは必須です。
  -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">




  <!-- ======================================== -->
  <!-- 🏷 ブラウザタイトル -->
  <!-- ======================================== -->

  <!--
  ブラウザ上部やタブに表示されます。

  後から作品名へ変更できます。
  -->

  <title>WebAR Exhibition</title>




  <!-- ======================================== -->
  <!-- 🎮 A-Frame -->
  <!-- ======================================== -->

  <!--
  A-Frame は

  「3D空間を作るライブラリ」

  です。

  展示室そのものを作る担当です。

  例えるなら

  体育館を建てる大工さんです。
  -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>




  <!-- ======================================== -->
  <!-- 🎯 MindAR -->
  <!-- ======================================== -->

  <!--
  MindAR は

  「作品を見つけるライブラリ」

  です。

  カメラ映像を見て

  「この絵だ！」

  と認識してくれます。

  例えるなら

  展示会の受付スタッフです。
  -->

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

<!-- 🏛 展示室 -->
<!-- ======================================== -->

<!--
ここから展示室が始まります。

A-Frameでは

<a-scene>

が

「展示室」

になります。

この中に

動画

画像

3Dモデル

全部置きます。
-->

<a-scene

  <!--
  ========================================

  🎯 認識ファイル

  targets.mind

  を読み込みます。

  このファイルを変更すると

  別作品になります。

  ========================================
  -->

  mindar-image="imageTargetSrc: ./targets.mind;"



  <!--
  ========================================

  🎨 色を自然に表示

  color-space="sRGB"

  ========================================

  絵の色ができるだけ
  元画像に近く表示されます。

  基本的に変更しません。
  -->

  color-space="sRGB"



  <!--
  ========================================

  🎨 色管理

  renderer

  ========================================

  A-Frameへ

  「ちゃんと色管理してください」

  とお願いしています。

  基本的に変更しません。
  -->

  renderer="colorManagement: true;"



  <!--
  ========================================

  🥽 VRボタンを消す

  ========================================

  今回はARだけ使うので

  VRボタンはいりません。
  -->

  vr-mode-ui="enabled: false"



  <!--
  ========================================

  📱 カメラ許可画面

  ========================================

  スマホで

  カメラ使用許可

  を表示します。

  ARでは必須です。
  -->

  device-orientation-permission-ui="enabled: true"

>

<!-- 🏢 受付 -->
<!-- ======================================== -->

<!--

受付では

画像

動画

音

などを

先に読み込みます。

展示会でいうと

受付で来場者の名簿を準備している

ようなイメージです。

ここで読み込んでおくことで

作品を認識した瞬間に

すぐ動画を表示できます。

<a-assets>




  <!-- ======================================== -->
  <!-- 🎥 展示動画 -->
  <!-- ======================================== -->

  <!--

  ★★★★★★★★★★★★★★★★★★★★

  【作品ごとに変更します】

  src="./movie.mp4"

  ↑

  このファイル名だけ変更します。

  例

  src="./butsumetsu.mp4"

  src="./pink.mp4"

  src="./green.mp4"

  など

  ★★★★★★★★★★★★★★★★★★★★
  ★★★★★★★★★★★★★★★★★★★★

  通常は変更しません。

  ファイル名を統一している場合

  movie.mp4

  targets.mind

  のままでOK！

  ★★★★★★★★★★★★★★★★★★★★

  -->

  <video

    id="movie"

    src="./butsumetsu2.mp4"




    <!--
    preload

    auto

    最初に全部読み込みます。

    Safari対策にもなります。

    基本変更しません。
    -->

    preload="auto"




    <!--

    muted

    ミュート

    iPhoneでは

    ミュートじゃない動画は

    自動再生できません。

    基本変更しません。

    -->

    muted




    <!--

    playsinline

    スマホで

    全画面再生を防ぎます。

    ARでは必須です。

    -->

    playsinline




    <!--

    webkit-playsinline

    Safari用

    playsinline

    と同じ意味です。

    -->

    webkit-playsinline




    <!--

    crossorigin

    GitHub Pagesで

    動画を読み込めるようにします。

    -->

    crossorigin="anonymous"




    <!--

    loop

    繰り返し再生

    展示ではONがおすすめ。

    -->

    loop>

  </video>

</a-assets>





<!-- ======================================== -->
<!-- 📷 来場者 -->
<!-- ======================================== -->

<!--

a-camera

は

来場者

  <!-- ======================================== -->

  src="#movie"

  は

  受付(a-assets)

  movie

  基本変更しません。

    src="#movie"




    <!--

    position

    動画を置く位置

    真ん中なら

    0 0 0

    基本ここから調整します。

    -->

    position="0 0 0"




    <!--

    rotation

    回転

    基本

    0 0 0

    のままでOK

    -->

    rotation="0 0 0"


<!-- ======================================== -->
<!-- 🎨 作家さん調整エリア -->
<!-- 作品ごとに一番触る場所です -->
<!-- ======================================== -->

    <!--

    ★★★★★★★★★★★★★★★★★★★★

    【作品ごとに変更します】

    width

    動画の横幅

    height

    動画の高さ

    ★★★★★★★★★★★★★★★★★★★★

    Blender作品や

    Canva作品で

    微調整します。

    */

    例

    width="2"

    height="1"

    */

    -->

    width="2"

    height="1">

  </a-video>

</a-entity>

================================================

🎬 この章は何をするの？

今までは

🏛 展示室

🏢 受付

🖼 展示場所

を作りました。

ここからは

「作品を見つけたら動画を再生する」

という

頭脳（JavaScript）

を作ります。

================================================

📖 この章の流れ

STEP1

HTMLから必要なものを探す

　　　　↓

STEP2

作品を見つけたら

　　　　↓

STEP3

動画を再生する

　　　　↓

STEP4

作品を見失ったら停止する

================================================

今回は

STEP1だけ

作ります😊

-->
<script>

// 🎬 STEP1

//
// 📖 このSTEPでやること

// 「変わらない箱」

// 今回は
//
// movie
//
// target
//
// という箱を作ります。
//
// 💡 理解できなくても大丈夫です。
//
// 「箱を作っているんやなぁ」
//
// くらいでOK😊
//
// 🟢 基本変更しません。
//
// ========================================






// ========================================
// 📖 JavaScript辞典②
//
// document
//
// ========================================

//
// document
//
// は
//
// HTML全体
//
// のことです。
//
// index.html 全部を
//
// 見ています。
//
// 🟢 基本変更しません。
//
// ========================================






// ========================================
// 📖 JavaScript辞典③
//
// querySelector()
//
// ========================================

//
// querySelector()
//
// は
//
// 「探してください」
//
// という命令です。
//
// HTMLの中から
//
// 指定したものを探します。
//
// 例
//
// "#movie"
//
// ↓
//
// id="movie"
//
// を探します。
//
// 🟢 基本変更しません。
//
// ========================================






// ========================================
// 🎥 動画を探す

// HTMLの
//

// を探します。

// 見つけた動画は
//
// movie
//

// ========================================

const movie = document.querySelector("#movie");






// ========================================
// 🖼 展示場所を探す

//
// HTMLの
//
// <a-entity mindar-image-target>

//
// 見つけた展示場所を

// target
//
// という箱へ入れます。
//
// 🟢 基本変更しません。
//
// ========================================

const target = document.querySelector("[mindar-image-target]");






// ========================================
// 📖 確認
// ========================================

//
// ここまでで
//
// JavaScriptは
//
// 何を覚えたの？
//
// ↓
//
// 🎥 movie
//
// 動画が入った箱
//
// 🖼 target
//
// 展示場所が入った箱
//
// この2つだけです。
//
// まだ動画は
//
// 動きません😊
//
// ========================================

<!--

================================================

🎯 このSTEPの目的

// ========================================
// 📖 まずは一文を分解してみよう！
// ========================================

//
// これから出てくるコードは

// 一見すると長い英語です。
//
// でも実際は

//
// ========================================



🖼 target

↓

👀 addEventListener

↓

"targetFound"

↓

🤖 async

↓

() =>

↓

{

//
//

// ========================================

//

//
// ========================================

// add
//
// 追加する

// event
//
// 出来事

// ========================================

//
// target
//
// 展示作品
//
// found
//
// 見つけた
//
// つまり
//
// 「作品を見つけた！」

// ⚠️ スペルを変えると

// 📖 JavaScript辞典⑥
//
// async
//
// ========================================

//
// async は
//
// 「これから少し時間がかかる
// 仕事をするよ」
//
// とJavaScriptへ伝えています。
//
// 今は
//
// 「そういう目印なんやな」

// くらいで十分です😊
//
// 後で

// movie.play()
//
// が出てきた時に
//
// 「だからasyncが必要なんや！」

// と繋がります。
//
// 🟢 基本触りません。
//
// ========================================

// ========================================
// 👀 見張り番を配置する
// ========================================

//
// 🎯 このコードの役割

// 展示場所(target)へ

// 見張り番を置きます。

// 「見えました！」

// と教えてくれます😊

target.addEventListener("targetFound", async () => {

// ========================================
// 📖 この時点では何が起きた？
// ========================================

//
// JavaScript
//
// 「了解！
//
// 作品が見えたら

//

// ・動画再生まで

//
// 🔍 最初に見る場所
//
// ✅ target が取得できているか
//
// ✅ targetFound のスペル
//
// ✅ addEventListener のスペル
//
// 💬 ChatGPTへ相談するとき
//
// 「STEP2の見張り番までは
// 理解できました。
//
// でも作品を映しても

//
//
//
// と伝えると

//

//

// ↓

// 待つ
