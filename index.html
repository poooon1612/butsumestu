<!DOCTYPE html>
<html lang="ja">

<head>

    <!-- ======================================== -->
    <!-- 📦 WebAR Template Ver1.3.1               -->
    <!-- Exhibition Edition                       -->
    <!-- ======================================== -->

    <!--
    このテンプレートは
    「作品を認識して動画を表示する」
    WebAR展示用テンプレートです。

    🔴 編集する場所
      ・movie.mp4
      ・targets.mind
      ・position
      ・rotation
      ・scale
      ・VERSION

    🟢 その他は基本変更しません。

    保存方法
      ・VSCode推奨
      ・UTF-8
      ・LF
      ・index.html
    -->



    <!-- ======================================== -->
    <!-- 🌏 日本語対応                            -->
    <!-- ======================================== -->

    <meta charset="UTF-8">



    <!-- ======================================== -->
    <!-- 📱 スマホ対応                            -->
    <!-- ======================================== -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">



    <!-- ======================================== -->
    <!-- 🏷 タイトル                              -->
    <!-- ======================================== -->

    <title>WebAR Exhibition</title>



    <!-- ======================================== -->
    <!-- 🎮 A-Frame                              -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>



    <!-- ======================================== -->
    <!-- 🎯 MindAR                               -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!-- ======================================== -->
    <!-- 🏛 展示室                               -->
    <!-- ======================================== -->

    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true;"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: true"

    >

            <!-- ======================================== -->
        <!-- 🏢 受付（読み込みエリア）                -->
        <!-- ======================================== -->

        <a-assets>

            <!-- ======================================== -->
            <!-- 🔴 展示動画                             -->
            <!-- 作品ごとにファイル名だけ変更します       -->
            <!-- ======================================== -->

            <video
                id="movie"

                preload="auto"

                muted

                playsinline

                webkit-playsinline

                crossorigin="anonymous"

                loop>

            </video>

        </a-assets>



        <!-- ======================================== -->
        <!-- 📷 カメラ                                -->
        <!-- 基本変更しません                         -->
        <!-- ======================================== -->

        <a-camera position="0 0 0"></a-camera>



        <!-- ======================================== -->
        <!-- 🖼 認識した作品の表示場所                -->
        <!-- ======================================== -->

        <a-entity id="target" mindar-image-target="targetIndex: 0">

        </a-entity>

        <!-- ======================================== -->
        <!-- 🎬 動画制御                             -->
        <!-- ======================================== -->

        <script>

            // ========================================
            // 🔴 動画更新時だけ数字を変更します
            // ========================================

            // ========================================
            // 🔴 編集する場所
            // ========================================

            // 動画ファイル名（ここだけ変更します）
            const MOVIE = "butsumetsu2.mp4";
            
            // キャッシュ更新時だけ数字を変更します
            const VERSION = 26;


            // ========================================
            // 基本設定（変更しません）
            // ========================================

            const movie = document.querySelector("#movie");

            // 動画を毎回新しく読み込む
            movie.pause();
            movie.removeAttribute("src");
            movie.load();

            movie.src = `./${MOVIE}?v=${VERSION}`;
            movie.load();

            const target =document.querySelector("#target");
            // ========================================
            // Three.js管理（Ver1.4.0）
            // ========================================

            // Geometry
            let videoGeometry = null;

            // Material
            let videoMaterial = null;

            // Texture
            let videoTexture = null;

            // Mesh
            let videoMesh = null;


            // ========================================
            // Three.js関数
            // Part1ではまだ中身は作りません
            // ========================================

            function createVideoMesh() {

    console.log("① createVideoMesh()開始");

    const scene = document.querySelector("a-scene");

    if (!scene) {

        console.error("❌ Scene取得失敗");

        return;

    }

    console.log("② Scene取得成功");

    if (!scene.object3D) {

        console.error("❌ Three.js取得失敗");

        return;

    }

    console.log("③ Three.js取得成功");

    console.log(scene.object3D);

    // ========================================
    // 🪵 板（Geometry）を作る
    // ========================================

    videoGeometry = new THREE.PlaneGeometry(2, 1);

    console.log("④ Geometry作成成功");

    console.log(videoGeometry);

    // ========================================
    // 🎨 板の見た目（Material）を作る
    // ========================================

    videoMaterial = new THREE.MeshBasicMaterial({

      color: 0xffffff,

      side: THREE.DoubleSide

});

    console.log("⑤ Material作成成功");

    console.log(videoMaterial);

    // ========================================
    // 🎥 動画テクスチャ（VideoTexture）を作る
    // ========================================

    videoTexture = new THREE.VideoTexture(movie);

    console.log("⑥ VideoTexture作成成功");

    console.log(videoTexture);

    // ========================================
    // 🖼 Geometry + Material を合体して
    // Mesh（完成品）を作る
    // ========================================

    videoMesh = new THREE.Mesh(
      videoGeometry,
      videoMaterial
);

    // 動画をMaterialへ貼り付ける
    videoMaterial.map = videoTexture;

    // Material更新
    videoMaterial.needsUpdate = true;

    console.log("⑦ Mesh作成成功");

    console.log(videoMesh);

    // ========================================
    // 📍 Meshの位置・大きさ・向きを設定
    // ========================================

    // 原画の中心
    videoMesh.position.set(0, 0, 0);

    // 大きさ
    videoMesh.scale.set(1, 1, 1);

    // 向き
    videoMesh.rotation.set(0, 0, 0);

    console.log("⑨ Mesh位置設定成功");

    console.log(videoMesh.position);

    console.log(videoMesh.scale);

    console.log(videoMesh.rotation);

    // ========================================
    // 🏛 MeshをSceneへ追加
    // ========================================

    // targetのThree.jsオブジェクトへ追加
    target.object3D.add(videoMesh);

    console.log("⑧ Scene追加成功");

    console.log(target.object3D);

}

            function removeVideoMesh() {

            console.log("🗑 removeVideoMesh() 準備完了");

}

            function disposeVideoMesh() {

            console.log("♻ disposeVideoMesh() 準備完了");

}
            // ========================================
            // 認識開始
            // ========================================

           target.addEventListener("targetFound", async () => {

    console.log("🎯 targetFound");

    // ===========================
    // Safari検証
    // まず再生してみる
    // ===========================

    try {

        console.log("▶️ create前 play開始");

        await movie.play();

        console.log("✅ create前 play成功");

    } catch(e) {

        console.error("❌ create前 play失敗", e);

    }

    // ===========================
    // その後Three.js生成
    // ===========================

    createVideoMesh();

    const playButton = document.getElementById("playButton");

playButton.style.display = "block";

console.log("▶ TAP TO PLAY表示");


    try {
        const oldVideo = target.querySelector("a-video");

        if (oldVideo) {

        // Three.jsのMeshを取得
        const mesh = oldVideo.getObject3D("mesh");

        if (mesh && mesh.material) {

        if (mesh.material.map) {
            mesh.material.map.dispose();
       }

            mesh.material.dispose();

}

oldVideo.remove();

        }

        /*

        const videoPlane = document.createElement("a-video");

        videoPlane.setAttribute("src", "#movie");

        videoPlane.setAttribute("width", "2");

        videoPlane.setAttribute("height", "1");

        videoPlane.setAttribute("position", "0 0 0");

        videoPlane.setAttribute("rotation", "0 0 0");

        videoPlane.setAttribute("scale", "2 1 1");

        target.appendChild(videoPlane);

        videoPlane.setAttribute("visible", false);

        console.log("⑩ a-video非表示");

        */

          movie.currentTime = 0;

          movie.addEventListener("loadeddata", () => {
          console.log("📹 loadeddata");
});

          movie.addEventListener("canplay", () => {
          console.log("▶ canplay");
});

          movie.addEventListener("playing", () => {
          console.log("🎞 playing");
});

          movie.addEventListener("error", () => {
          console.log("❌ video error", movie.error);
});

          console.log("🎬 play前");

          console.log("ended =", movie.ended);
          console.log("muted =", movie.muted);
          console.log("volume =", movie.volume);
          console.log("autoplay =", movie.autoplay);
          console.log("loop =", movie.loop);
          console.log("playsInline =", movie.playsInline);
          console.log("document.visibilityState =", document.visibilityState);
          console.log("hasFocus =", document.hasFocus());

          console.log("readyState =", movie.readyState);
          console.log("networkState =", movie.networkState);
          console.log("paused =", movie.paused);
          console.log("currentTime =", movie.currentTime);

          console.log("src =", movie.currentSrc);

          // ========================================
          // Safariが「再生可能」と言うまで待つ
          // ========================================

          if (movie.readyState < 3) {

          console.log("⏳ canplay待機開始");

          await new Promise(resolve => {

          const onCanPlay = () => {

            console.log("✅ canplay待機完了");

            movie.removeEventListener("canplay", onCanPlay);

            resolve();

        };

            movie.addEventListener("canplay", onCanPlay);

    });

} else {

            console.log("✅ canplay待機不要");

}

          await movie.play();

          console.log("🎉 play成功");

    } catch (error) {

    console.error("動画再生エラー", error);

    console.log("name =", error.name);
    console.log("message =", error.message);
    console.log("code =", error.code);

}

const playButton = document.getElementById("playButton");

playButton.onclick = async () => {

    console.log("👆 ユーザータップ");

    try {

        await movie.play();

        console.log("✅ タップ再生成功");

        playButton.style.display = "none";

    } catch(e){

        console.error("❌ タップ再生失敗", e);

    }

};

});

// ========================================
// 認識終了
// ========================================

target.addEventListener("targetLost", () => {

    movie.pause();

    movie.currentTime = 0;

});

        </script>

    </a-scene>
    <!-- Safari用 再生ボタン -->
<div id="playButton"
     style="
     position:fixed;
     left:50%;
     top:50%;
     transform:translate(-50%,-50%);
     padding:18px 28px;
     background:#000;
     color:#fff;
     border-radius:12px;
     font-size:24px;
     font-weight:bold;
     z-index:9999;
     display:none;
     cursor:pointer;">
▶ TAP TO PLAY
</div>

</body>

</html>
