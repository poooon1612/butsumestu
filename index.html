<!DOCTYPE html>
<html lang="ja">

<head>

    <!-- ======================================== -->
    <!-- 📦 WebAR Template Ver1.3.1               -->
    <!-- Exhibition Edition                       -->
    <!-- ======================================== -->

    <!--
    このテンプレートは
    「作品を認識して動画を表示する」
    WebAR展示用テンプレートです。

    🔴 編集する場所
      ・movie.mp4
      ・targets.mind
      ・position
      ・rotation
      ・scale
      ・VERSION

    🟢 その他は基本変更しません。

    保存方法
      ・VSCode推奨
      ・UTF-8
      ・LF
      ・index.html
    -->



    <!-- ======================================== -->
    <!-- 🌏 日本語対応                            -->
    <!-- ======================================== -->

    <meta charset="UTF-8">



    <!-- ======================================== -->
    <!-- 📱 スマホ対応                            -->
    <!-- ======================================== -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">



    <!-- ======================================== -->
    <!-- 🏷 タイトル                              -->
    <!-- ======================================== -->

    <title>WebAR Exhibition</title>



    <!-- ======================================== -->
    <!-- 🎮 A-Frame                              -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>



    <!-- ======================================== -->
    <!-- 🎯 MindAR                               -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!-- ======================================== -->
    <!-- 🏛 展示室                               -->
    <!-- ======================================== -->

    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true;"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: true"

    >

            <!-- ======================================== -->
        <!-- 🏢 受付（読み込みエリア）                -->
        <!-- ======================================== -->

        <a-assets>

            <!-- ======================================== -->
            <!-- 🔴 展示動画                             -->
            <!-- 作品ごとにファイル名だけ変更します       -->
            <!-- ======================================== -->

            <video
                id="movie"

                preload="auto"

                muted

                playsinline

                webkit-playsinline

                crossorigin="anonymous"

                loop>

            </video>

        </a-assets>



        <!-- ======================================== -->
        <!-- 📷 カメラ                                -->
        <!-- 基本変更しません                         -->
        <!-- ======================================== -->

        <a-camera position="0 0 0"></a-camera>



        <!-- ======================================== -->
        <!-- 🖼 認識した作品の表示場所                -->
        <!-- ======================================== -->

        <a-entity mindar-image-target="targetIndex: 0">

            <a-video

                src="#movie"

                position="0 0 0"

                rotation="0 0 0"

                scale="1 1 1">

            </a-video>

        </a-entity>

                <!-- ======================================== -->
        <!-- 🎬 動画制御                             -->
        <!-- ======================================== -->

        <script>

            // ========================================
            // 🔴 動画更新時だけ数字を変更します
            // ========================================

            // ========================================
            // 🔴 編集する場所
            // ========================================

            // 動画ファイル名（ここだけ変更します）
            const MOVIE = "0001-0250.mp4";
            
            // キャッシュ更新時だけ数字を変更します
            const VERSION = 1;


            // ========================================
            // 基本設定（変更しません）
            // ========================================

            const movie = document.querySelector("#movie");

            // 動画を毎回新しく読み込む
            movie.pause();
            movie.removeAttribute("src");
            movie.load();

            movie.src = `./${MOVIE}?v=${VERSION}`;
            movie.load();

            const target = document.querySelector("[mindar-image-target]");

            // ========================================
            // 認識開始
            // ========================================

            target.addEventListener("targetFound", async () => {

                try {

                    movie.currentTime = 0;

                    await movie.play();

                } catch (error) {

                    console.error("動画再生エラー", error);

                }

            });



            // ========================================
            // 認識終了
            // ========================================

            target.addEventListener("targetLost", () => {

                movie.pause();

                movie.currentTime = 0;

            });

        </script>

    </a-scene>

</body>

</html>
