<!DOCTYPE html>
<html lang="ja">

<head>

    <!-- ======================================== -->
    <!-- 📦 WebAR Template Ver1.3.1               -->
    <!-- Exhibition Edition                       -->
    <!-- ======================================== -->

    <!--
    このテンプレートは
    「作品を認識して動画を表示する」
    WebAR展示用テンプレートです。

    🔴 編集する場所
      ・movie.mp4
      ・targets.mind
      ・position
      ・rotation
      ・scale
      ・VERSION

    🟢 その他は基本変更しません。

    保存方法
      ・VSCode推奨
      ・UTF-8
      ・LF
      ・index.html
    -->



    <!-- ======================================== -->
    <!-- 🌏 日本語対応                            -->
    <!-- ======================================== -->

    <meta charset="UTF-8">



    <!-- ======================================== -->
    <!-- 📱 スマホ対応                            -->
    <!-- ======================================== -->

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">



    <!-- ======================================== -->
    <!-- 🏷 タイトル                              -->
    <!-- ======================================== -->

    <title>WebAR Exhibition</title>



    <!-- ======================================== -->
    <!-- 🎮 A-Frame                              -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>



    <!-- ======================================== -->
    <!-- 🎯 MindAR                               -->
    <!-- 基本変更しません                         -->
    <!-- ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!-- ======================================== -->
    <!-- 🏛 展示室                               -->
    <!-- ======================================== -->

    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true;"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: true"

    >

            <!-- ======================================== -->
        <!-- 🏢 受付（読み込みエリア）                -->
        <!-- ======================================== -->

        <a-assets>

            <!-- ======================================== -->
            <!-- 🔴 展示動画                             -->
            <!-- 作品ごとにファイル名だけ変更します       -->
            <!-- ======================================== -->

            <video
                id="movie"

                preload="auto"

                muted

                playsinline

                webkit-playsinline

                crossorigin="anonymous"

                loop>

            </video>

        </a-assets>



        <!-- ======================================== -->
        <!-- 📷 カメラ                                -->
        <!-- 基本変更しません                         -->
        <!-- ======================================== -->

        <a-camera position="0 0 0"></a-camera>



        <!-- ======================================== -->
        <!-- 🖼 認識した作品の表示場所                -->
        <!-- ======================================== -->

        <a-entity id="target" mindar-image-target="targetIndex: 0">

        </a-entity>

        <!-- ======================================== -->
        <!-- 🎬 動画制御                             -->
        <!-- ======================================== -->

        <script>

            // ========================================
            // 🔴 動画更新時だけ数字を変更します
            // ========================================

            // ========================================
            // 🔴 編集する場所
            // ========================================

            // 動画ファイル名（ここだけ変更します）
            const MOVIE = "butsumetsu2.mp4";
            
            // キャッシュ更新時だけ数字を変更します
            const VERSION = 14;


            // ========================================
            // 基本設定（変更しません）
            // ========================================

            const movie = document.querySelector("#movie");

            // 動画を毎回新しく読み込む
            movie.pause();
            movie.removeAttribute("src");
            movie.load();

            movie.src = `./${MOVIE}?v=${VERSION}`;
            movie.load();

            const target =document.querySelector("#target");
            // ========================================
            // Three.js管理（Ver1.4.0）
            // ========================================

            // Geometry
            let videoGeometry = null;

            // Material
            let videoMaterial = null;

            // Texture
            let videoTexture = null;

            // Mesh
            let videoMesh = null;


            // ========================================
            // Three.js関数
            // Part1ではまだ中身は作りません
            // ========================================

            function createVideoMesh() {

    console.log("① createVideoMesh()開始");

    const scene = document.querySelector("a-scene");

    if (!scene) {

        console.error("❌ Scene取得失敗");

        return;

    }

    console.log("② Scene取得成功");

    if (!scene.object3D) {

        console.error("❌ Three.js取得失敗");

        return;

    }

    console.log("③ Three.js取得成功");

    console.log(scene.object3D);

    // ========================================
    // 🪵 板（Geometry）を作る
    // ========================================

    videoGeometry = new THREE.PlaneGeometry(2, 1);

    console.log("④ Geometry作成成功");

    console.log(videoGeometry);

    // ========================================
    // 🎨 板の見た目（Material）を作る
    // ========================================

    videoMaterial = new THREE.MeshBasicMaterial({

      color: 0xffffff,

      side: THREE.DoubleSide

});

    console.log("⑤ Material作成成功");

    console.log(videoMaterial);

}

            function removeVideoMesh() {

            console.log("🗑 removeVideoMesh() 準備完了");

}

            function disposeVideoMesh() {

            console.log("♻ disposeVideoMesh() 準備完了");

}
            // ========================================
            // 認識開始
            // ========================================

           target.addEventListener("targetFound", async () => {
            createVideoMesh();

    try {
        const oldVideo = target.querySelector("a-video");

        if (oldVideo) {

        // Three.jsのMeshを取得
        const mesh = oldVideo.getObject3D("mesh");

        if (mesh && mesh.material) {

        if (mesh.material.map) {
            mesh.material.map.dispose();
       }

            mesh.material.dispose();

}

oldVideo.remove();

        }

        const videoPlane =
        document.createElement("a-video");

        videoPlane.setAttribute("src", "#movie");

        videoPlane.setAttribute("position", "0 0 0");

        videoPlane.setAttribute("rotation", "0 0 0");

        videoPlane.setAttribute("scale", "2 1 1");

        target.appendChild(videoPlane);

        movie.currentTime = 0;

        await movie.play();


    } catch (error) {

        console.error("動画再生エラー", error);

    }

});

// ========================================
// 認識終了
// ========================================

target.addEventListener("targetLost", () => {

    movie.pause();

    movie.currentTime = 0;

});

        </script>

    </a-scene>

</body>

</html>
